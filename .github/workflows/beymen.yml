name: Beymen Tech Scraper Daily

on:
  schedule:
    # Launch at 10:00 UTC daily
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests seleniumbase

      - name: Install browser
        run: seleniumbase install chromedriver

      - name: Run Scraper
        run: python InflationItems/Codes/08_Communication/BeymenTech/scraper.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add InflationItems/Datas/08_Communication/Beymen/beymen_tech_*.csv
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Auto-update: Beymen tech data [skip ci]"
          # other scraper workflows push to the same branch: rebase onto theirs first
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((attempt * 15))
          done
          exit 1