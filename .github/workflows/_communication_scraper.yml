name: 08_Communication scraper (reusable)

# Runs one 08_Communication scraper through the cron server's own runner
# (deploy/scraper-server/bin/run_scraper.sh: name -> script, timeout, Chrome
# cleanup) and commits its CSVs. Called by the scraper_<name>.yml workflows.

on:
  workflow_call:
    inputs:
      scraper:
        description: run_scraper.sh name (samsung, huawei, pozitif, dr, beymen, vatan, telecom, internet, streaming, repair)
        required: true
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # run_scraper.sh's longest timeout is 120 min (vatan) + 2 min kill grace
    timeout-minutes: 150
    env:
      # scrapers date their CSVs with date.today(); match the cron server
      TZ: Europe/Istanbul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: deploy/scraper-server/requirements.txt

      # Google Chrome is preinstalled on ubuntu-latest (Beymen 403 fallback,
      # TurkNet cookie visit, tabii); the scrapers detect its major version.
      - name: Install pinned dependencies and runner script
        run: |
          python -m venv venv
          venv/bin/pip install -r deploy/scraper-server/requirements.txt
          mkdir -p bin
          cp deploy/scraper-server/bin/run_scraper.sh bin/

      - name: Run ${{ inputs.scraper }}
        run: bash bin/run_scraper.sh '${{ inputs.scraper }}'

      - name: Show scraper log
        if: ${{ !cancelled() }}
        run: |
          cat log.txt
          cat server_logs/*.log || true

      # Also after a failure: Telecom and Vatan save what they collected and
      # exit non-zero when one source fails or bans the IP.
      - name: Commit and push data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add InflationItems/Datas/08_Communication/
          if git diff --staged --quiet; then
            echo "No new ${{ inputs.scraper }} data to commit."
            exit 0
          fi
          git commit -m "chore(data): ${{ inputs.scraper }} scrape $(date +'%Y-%m-%d')"
          # other scraper workflows push to the same branch
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((attempt * 15))
          done
          exit 1
