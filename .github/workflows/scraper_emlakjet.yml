name: Emlakjet Rental Scraper

on:
  schedule:
    # 16:00 Istanbul (UTC+3). Every other scraper is done by then (last: Beymen
    # Tech 13:00) and the next one starts at 01:00, so a 2-4 h crawl overlaps
    # nothing; see SCRAPER_TIMETABLE.md
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      workers:
        description: Parallel request streams (per-IP request rate scales with it)
        default: '3'
        required: false
      start_url:
        description: Optional scope to crawl instead of all of Türkiye (testing)
        required: false
      max_pages_per_scope:
        description: Optional page bound per leaf scope (testing)
        required: false

permissions:
  contents: write

# one crawl at a time; a late run must not cancel a running one
concurrency:
  group: emlakjet-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # full crawl: ~65 min with one worker locally (2026-10-23); runners may be 2x slower
    timeout-minutes: 240
    env:
      # the scraper dates its CSV with date.today(); match the other workflows
      TZ: Europe/Istanbul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: deploy/scraper-server/requirements.txt

      # requests-only scraper: no browser needed (curl_cffi Chrome TLS impersonation)
      - name: Install dependencies
        run: pip install beautifulsoup4==4.15.0 lxml==6.1.3 curl-cffi==0.16.3

      - name: Run scraper
        env:
          WORKERS: ${{ inputs.workers || '3' }}
          START_URL: ${{ inputs.start_url }}
          MAX_PAGES: ${{ inputs.max_pages_per_scope }}
        run: |
          args=(--workers "$WORKERS" --resume)
          [ -n "$START_URL" ] && args+=(--start-url "$START_URL")
          [ -n "$MAX_PAGES" ] && args+=(--max-pages-per-scope "$MAX_PAGES")
          mkdir -p logs
          python InflationItems/Codes/04_Housing/Emlakjet/scraper.py "${args[@]}" 2>&1 | tee logs/emlakjet.log

      # Also after a failure or timeout, but a run that only got a few rows
      # must not replace a good day's file.
      - name: Commit and push data
        if: ${{ always() }}
        run: |
          f="InflationItems/Datas/04_Housing/Emlakjet/emlakjet_$(date +%F).csv"
          if [ ! -f "$f" ] || [ "$(wc -l < "$f")" -lt 10000 ]; then
            echo "No complete-enough CSV ($f), not committing."
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "$f"
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Auto-update: Emlakjet rentals $(date +%F) [skip ci]"
          # other scraper workflows push to the same branch: rebase onto theirs first
          for attempt in 1 2 3 4 5; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((attempt * 15))
          done
          exit 1
